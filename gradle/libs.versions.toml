[versions]
kotlin = "2.3.21"
kotlinx-serialization = "1.11.0"
benManes-versions = "0.54.0"
exposed = "1.3.0"
nmcp = "0.0.9"
mke-utils = "4.0.0-rc2"
rs-google = "2.0.3"
rs-tg-bot = "1.0.0-beta.20"
rs-utils = "4.2.0"

[libraries]

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# database
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }

# google
google-apis-sheets = { module = "com.google.apis:google-api-services-sheets", version = "v4-rev20241008-2.0.0" }

# raysmith
raysmith-utils = { module = "ru.raysmith:utils", version.ref = "rs-utils" }
raysmith-utils-jvm = { module = "ru.raysmith:utils-jvm", version.ref = "rs-utils" }
raysmith-tgBot = { module = "ru.raysmith:tg-bot", version.ref = "rs-tg-bot" }
raysmith-tgBot-jvm = { module = "ru.raysmith:tg-bot-jvm", version.ref = "rs-tg-bot" }
raysmith-google = { module = "ru.raysmith:google", version.ref = "rs-google" }

[plugins]
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
benManes-versions = { id = "com.github.ben-manes.versions", version.ref = "benManes-versions" }
